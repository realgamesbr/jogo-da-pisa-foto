<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Pisa — Sua Foto</title>
  <link rel="icon" type="image/png" href="https://realgamesstudio.com.br/images/vp26logogame-1778807588778.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />

  <!--
    ================================================================
    CONFIGURACAO — ajustes em produção em produção
    ================================================================
    - APPS_SCRIPT_URL: já preenchida com a URL do Web App
    - GAME_ID: deve bater com EXPECTED_GAME_ID do Apps Script
    - {{media_placeholder}} é substituído pelo pipeline ao gerar QR
    ================================================================
  -->
  <style>
    :root {
      --wine-deep: #2A0F12;
      --wine: #4A1C20;
      --wine-card: #3A1518;
      --gold: #C9A96E;
      --gold-bright: #E0B97A;
      --cream: #F4E4C9;
      --cream-soft: #E8D5B0;
      --text-dark: #2A0F12;
      --error: #E57373;
    }

    * { box-sizing: border-box; }

    html, body { height: auto; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Libre Baskerville', Georgia, serif;
      background:
        radial-gradient(ellipse at top, rgba(74, 28, 32, 0.5) 0%, transparent 60%),
        linear-gradient(180deg, var(--wine-deep) 0%, #1A0608 100%);
      background-attachment: fixed;
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 0;
      flex: 1;
    }

    /* ============ TOP — 3 LOGOS EM COLUNAS IGUAIS ============ */
    .top-logos {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 22px;
      padding: 0 4px;
    }

    .top-logos-col {
      flex: 1 1 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-side {
      max-width: 95px;
      max-height: 75px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .logo-game-top {
      max-width: 130px;
      max-height: 95px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* Na tela da foto: mantem so o logo do jogo, centralizado */
    body.photo-mode .col-side { display: none; }
    body.photo-mode .sponsor-bar { display: none !important; }

    /* ============ CARD PRINCIPAL ============ */
    .main-card {
      background: var(--wine-card);
      border: 1px solid rgba(201, 169, 110, 0.35);
      border-radius: 4px;
      width: 100%;
      padding: 24px 22px 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      margin-bottom: 16px;
    }

    .form-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--cream);
      margin: 0 0 10px;
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
    }

    .form-subtitle {
      font-size: 13px;
      line-height: 1.5;
      color: var(--cream-soft);
      text-align: center;
      margin: 0 0 20px;
      padding: 0 8px;
    }

    /* ============ FORM ============ */
    .input-wrapper {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-email {
      width: 100%;
      padding: 12px 14px;
      font-family: 'Libre Baskerville', serif;
      font-size: 14px;
      color: var(--cream);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(201, 169, 110, 0.3);
      border-radius: 3px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-email:focus {
      border-color: var(--gold);
      background: rgba(0, 0, 0, 0.5);
    }

    .input-email::placeholder {
      color: rgba(244, 228, 201, 0.35);
      font-style: italic;
    }

    .error-msg {
      color: var(--error);
      font-size: 11px;
      margin-top: 4px;
      min-height: 14px;
    }

    /* ============ CHECKBOXES ============ */
    .checkbox-group {
      margin: 14px 0 18px;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      flex-shrink: 0;
      margin-top: 2px;
      width: 16px;
      height: 16px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 11.5px;
      line-height: 1.4;
      color: var(--cream-soft);
    }

    .checkbox-label a {
      color: var(--gold-bright);
      text-decoration: underline;
    }

    /* ============ BUTTONS ============ */
    .btn {
      width: 100%;
      padding: 14px 18px;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--text-dark);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--gold-bright);
    }

    .btn-primary:disabled {
      background: rgba(201, 169, 110, 0.25);
      color: rgba(42, 15, 18, 0.4);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--cream-soft);
      border: 1px solid rgba(244, 228, 201, 0.35);
    }

    .btn-secondary:hover {
      border-color: var(--cream);
      background: rgba(244, 228, 201, 0.05);
    }

    .btn-primary.loading {
      pointer-events: none;
      opacity: 0.7;
    }
    .btn-primary.loading::after { content: '...'; }

    /* ============ PHOTO SECTION ============ */
    .photo-section {
      display: none;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }

    .photo-section.visible { display: block; }

    .photo-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--cream);
      margin: 0 0 4px;
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
    }

    .photo-subtitle {
      font-size: 13px;
      color: var(--cream-soft);
      text-align: center;
      margin: 0 0 16px;
    }

    .image-card {
      border: 2px solid var(--gold);
      border-radius: 4px;
      overflow: hidden;
      width: 100%;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      margin-bottom: 16px;
    }

    #dynamicImage {
      width: 100%;
      height: auto;
      display: block;
      max-height: 75vh;
    }


    .download-wrapper {
      text-align: center;
      margin-bottom: 8px;
    }

    .btn-download {
      display: inline-block;
      width: 100%;
      padding: 14px 32px;
      background: var(--gold);
      color: var(--text-dark);
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 3px;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .btn-download:hover { background: var(--gold-bright); }

    /* ============ FOOTER ============ */
    .footer-text {
      text-align: center;
      font-size: 10px;
      color: var(--cream-soft);
      opacity: 0.55;
      margin: 14px 0 18px;
      letter-spacing: 0.5px;
    }

    /* ============ BARRA DE PATROCINADORES (rodapé) ============ */
    .sponsor-bar {
      width: 100%;
      max-width: 400px;
      margin-top: auto;
      padding: 12px 0 0;
    }

    .sponsor-bar img {
      width: 100%;
      height: auto;
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- ============ TOP — 3 LOGOS EM COLUNAS IGUAIS ============ -->
    <div class="top-logos">
      <div class="top-logos-col col-side">
        <img class="logo-side"
             src="https://realgamesstudio.com.br/images/vp26logo1-1778806338771.png"
             alt="Rota dos Vinhos e do Enoturismo" />
      </div>
      <div class="top-logos-col col-center">
        <img class="logo-game-top"
             src="https://realgamesstudio.com.br/images/vp26logogame-1778807588778.png"
             alt="Jogo da Pisa da Uva" />
      </div>
      <div class="top-logos-col col-side">
        <img class="logo-side"
             src="https://realgamesstudio.com.br/images/vp26logo2-1778806355367.png"
             alt="Visit Porto & North Portugal" />
      </div>
    </div>

    <!-- ============ FORM DE CAPTURA ============ -->
    <div id="formCard" class="main-card">
      <h1 class="form-title">Sua foto está pronta!</h1>
      <p class="form-subtitle">
        Deixe seu email para receber novidades de Vinhos de Portugal — ou siga direto para sua foto.
      </p>

      <form id="leadForm" novalidate>
        <div class="input-wrapper">
          <label for="emailInput" class="input-label">Email</label>
          <input
            type="email"
            id="emailInput"
            class="input-email"
            placeholder="seu@email.com"
            autocomplete="email" />
          <div id="emailError" class="error-msg"></div>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-row">
            <input type="checkbox" id="consentMarketing" />
            <span class="checkbox-label">
              Quero receber novidades de Vinhos de Portugal por email.
            </span>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" id="consentPrivacy" />
            <span class="checkbox-label">
              Li e aceito a <a href="https://realgamesbr.github.io/jogo-da-pisa-foto/politica_privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.
            </span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" disabled>
          Ver Foto
        </button>
        <button type="button" id="skipBtn" class="btn btn-secondary">
          Não quero deixar meu email
        </button>
      </form>
    </div>

    <!-- ============ PHOTO SECTION (visível após captura ou skip) ============ -->
    <div id="photoSection" class="photo-section">
      <h2 class="photo-title">Saúde!</h2>
      <p class="photo-subtitle">Aqui está sua foto da pisa</p>

      <div class="image-card">
        <img id="dynamicImage" alt="Sua foto do Jogo da Pisa" />
      </div>

      <div class="download-wrapper">
        <a id="downloadButton" class="btn-download">Baixar Foto</a>
      </div>
    </div>

    <p class="footer-text">© Real Games Studio · Vinhos de Portugal 2026</p>

  </div>

  <!-- ============ BARRA DE PATROCINADORES ============ -->
  <div class="sponsor-bar">
    <img src="https://realgamesstudio.com.br/images/vp26barra-1778806316565.png"
         alt="COMPETE 2030 · União Europeia" />
  </div>

  <script>
    // ================================================================
    // CONFIGURACAO
    // ================================================================
    const GAME_ID = 'vinhos_pisa_2026';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTjvD6C5BNJ_jvPB0qqszHTNloeuoQ3zH0ENVzdbkTXe4Yq-bByLeF3HNEyDeEv9Uq/exec';

    // O placeholder é substituído pelo Content Mover ao gerar o QR (foto 1920x1080)
    const dynamicSrc = '{{media_placeholder}}';

    // ================================================================
    // ELEMENTOS
    // ================================================================
    const formCard = document.getElementById('formCard');
    const photoSection = document.getElementById('photoSection');
    const leadForm = document.getElementById('leadForm');
    const emailInput = document.getElementById('emailInput');
    const consentMarketing = document.getElementById('consentMarketing');
    const consentPrivacy = document.getElementById('consentPrivacy');
    const submitBtn = document.getElementById('submitBtn');
    const skipBtn = document.getElementById('skipBtn');
    const emailError = document.getElementById('emailError');
    const dynamicImage = document.getElementById('dynamicImage');
    const downloadButton = document.getElementById('downloadButton');

    // ================================================================
    // VALIDACAO
    // ================================================================
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const isValidEmail = (e) => EMAIL_REGEX.test(e.trim());

    function updateSubmitState() {
      submitBtn.disabled = !(isValidEmail(emailInput.value) && consentPrivacy.checked);
    }

    emailInput.addEventListener('input', () => {
      emailError.textContent = '';
      updateSubmitState();
    });
    emailInput.addEventListener('blur', () => {
      const v = emailInput.value.trim();
      if (v && !isValidEmail(v)) emailError.textContent = 'Email inválido. Verifique e tente novamente.';
    });
    consentMarketing.addEventListener('change', updateSubmitState);
    consentPrivacy.addEventListener('change', updateSubmitState);

    // ================================================================
    // FOTO
    // ================================================================
    function preparePhoto() {
      dynamicImage.src = dynamicSrc;
      downloadButton.href = dynamicSrc;
      const fileName = (window.location.pathname.split('/').pop() || 'jogo_da_pisa') + '.png';
      downloadButton.setAttribute('download', fileName);
    }

    function showPhoto() {
      preparePhoto();
      formCard.style.display = 'none';
      document.body.classList.add('photo-mode');
      photoSection.classList.add('visible');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ================================================================
    // ENVIO DE EVENTO (lead OU skip)
    // ================================================================
    async function sendEvent(payload) {
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      } catch (e) {
        console.error('Falha ao enviar evento', e);
        return false;
      }
    }

    function getPhotoId() {
      const params = new URLSearchParams(window.location.search);
      if (params.has('id')) return params.get('id');
      const fname = window.location.pathname.split('/').pop() || '';
      return fname.replace(/\.html?$/i, '') || 'unknown';
    }

    // ================================================================
    // SUBMIT — captura email
    // ================================================================
    leadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!isValidEmail(email)) {
        emailError.textContent = 'Email inválido.';
        return;
      }
      if (!consentPrivacy.checked) return;

      submitBtn.classList.add('loading');
      submitBtn.textContent = 'Enviando';

      const payload = {
        event: 'lead',
        game_id: GAME_ID,
        email: email,
        consent_marketing: consentMarketing.checked,
        consent_privacy: consentPrivacy.checked,
        photo_id: getPhotoId(),
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent
      };

      try { localStorage.setItem('vp_lead_submitted_' + getPhotoId(), '1'); } catch (_) {}

      sendEvent(payload);
      showPhoto();
    });

    // ================================================================
    // SKIP — pula sem deixar email (mas loga skip)
    // ================================================================
    skipBtn.addEventListener('click', () => {
      const payload = {
        event: 'skip',
        game_id: GAME_ID,
        email: '',
        consent_marketing: false,
        consent_privacy: false,
        photo_id: getPhotoId(),
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent
      };

      try { localStorage.setItem('vp_lead_skipped_' + getPhotoId(), '1'); } catch (_) {}

      sendEvent(payload);
      showPhoto();
    });

    // ================================================================
    // INIT — se ja preencheu, vai direto pra foto
    // ================================================================
    (function init() {
      const id = getPhotoId();
      const submitted = (() => { try { return localStorage.getItem('vp_lead_submitted_' + id); } catch (_) { return null; } })();
      const skipped = (() => { try { return localStorage.getItem('vp_lead_skipped_' + id); } catch (_) { return null; } })();
      if (submitted || skipped) showPhoto();
    })();
  </script>
</body>
</html>
