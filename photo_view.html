<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Pisa — Sua Foto</title>
  <link rel="icon" type="image/png" href="https://realgamesstudio.com.br/images/jogo_da_pisa_logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />

  <!--
    ================================================================
    CONFIGURACAO — SUBSTITUIR ANTES DE PUBLICAR
    ================================================================
    1) APPS_SCRIPT_URL: cole a URL do Web App publicado pelo Apps Script
    2) LOGO_GAME_URL: URL hospedada do logo do jogo (atualmente local)
    3) LOGO_CLIENT_URL: URL hospedada do logo do cliente
    4) PHOTO_PLACEHOLDER: o {{media_placeholder}} sera trocado pelo
       sistema que gera o link do QR code com a URL real da foto
    ================================================================
  -->
  <style>
    :root {
      --wine: #5C2A2A;
      --wine-dark: #3D1A1A;
      --plum: #694C5B;
      --peach: #F5C9A1;
      --cream: #F4E4C9;
      --olive: #5D6A2C;
      --gold: #C9A96E;
      --bg: #2A1414;
      --text-dark: #2A1414;
      --text-light: #F4E4C9;
      --error: #C62828;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Libre Baskerville', Georgia, serif;
      background:
        radial-gradient(ellipse at top, rgba(105,76,91,0.4) 0%, transparent 60%),
        radial-gradient(ellipse at bottom, rgba(92,42,42,0.6) 0%, transparent 70%),
        linear-gradient(180deg, var(--wine-dark) 0%, var(--bg) 100%);
      background-attachment: fixed;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    /* Header com logos */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 8px 0 24px;
      width: 100%;
      max-width: 380px;
    }

    .logo-game {
      max-width: 180px;
      max-height: 110px;
      width: auto;
      height: auto;
    }

    .logo-client {
      max-width: 80px;
      max-height: 80px;
      width: auto;
      height: auto;
      opacity: 0.95;
    }

    /* Container principal */
    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    /* Card do form */
    .form-card {
      background: rgba(20, 8, 8, 0.6);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .form-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--peach);
      margin: 0 0 8px;
      letter-spacing: 1px;
    }

    .form-subtitle {
      font-size: 14px;
      line-height: 1.5;
      color: var(--cream);
      opacity: 0.85;
      margin: 0 0 20px;
    }

    /* Input email */
    .input-wrapper {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-email {
      width: 100%;
      padding: 12px 14px;
      font-family: 'Libre Baskerville', serif;
      font-size: 15px;
      color: var(--text-light);
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(201, 169, 110, 0.4);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-email:focus {
      border-color: var(--gold);
      background: rgba(0,0,0,0.5);
    }

    .input-email::placeholder {
      color: rgba(244, 228, 201, 0.4);
    }

    /* Checkboxes */
    .checkbox-group {
      margin: 16px 0;
      text-align: left;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      flex-shrink: 0;
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 12px;
      line-height: 1.4;
      color: var(--cream);
      opacity: 0.9;
    }

    .checkbox-label a {
      color: var(--gold);
      text-decoration: underline;
    }

    /* Botões */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 14px 20px;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--text-dark);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--peach);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      background: rgba(201, 169, 110, 0.3);
      color: rgba(42, 20, 20, 0.5);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(244, 228, 201, 0.4);
    }

    .btn-secondary:hover {
      border-color: var(--cream);
      background: rgba(244, 228, 201, 0.05);
    }

    /* Mensagem de erro */
    .error-msg {
      color: var(--error);
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }

    /* Photo section */
    .photo-section {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .photo-section.visible {
      display: block;
    }

    .photo-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--peach);
      margin: 0 0 4px;
      letter-spacing: 1px;
    }

    .photo-subtitle {
      font-size: 13px;
      color: var(--cream);
      opacity: 0.75;
      margin: 0 0 16px;
    }

    .image-card {
      border: 4px solid var(--gold);
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    }

    #dynamicImage {
      width: 100%;
      height: auto;
      display: block;
      max-height: 70vh;
    }

    .download-wrapper {
      text-align: center;
      margin: 16px 0 8px;
    }

    .btn-download {
      display: inline-block;
      padding: 12px 32px;
      background: var(--gold);
      color: var(--text-dark);
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-download:hover {
      background: var(--peach);
    }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: var(--cream);
      opacity: 0.55;
      margin-top: 24px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading state */
    .btn-primary.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .btn-primary.loading::after {
      content: '...';
    }
  </style>
</head>
<body>
  <!-- Header com logos -->
  <div class="header">
    <img class="logo-game"
         src="https://realgamesstudio.com.br/images/jogo_da_pisa_logo.png"
         alt="Jogo da Pisa" />
    <img class="logo-client"
         src="https://realgamesstudio.com.br/images/cliente_logo_placeholder.png"
         alt="Cliente" />
  </div>

  <div class="container">

    <!-- ================================================================
         FORM DE CAPTURA (visivel inicialmente)
         ================================================================ -->
    <div id="formCard" class="form-card">
      <h1 class="form-title">Sua foto está pronta!</h1>
      <p class="form-subtitle">
        Deixe seu email para receber novidades de Vinhos de Portugal — ou siga direto para sua foto.
      </p>

      <form id="leadForm" novalidate>
        <div class="input-wrapper">
          <label for="emailInput" class="input-label">Email</label>
          <input
            type="email"
            id="emailInput"
            class="input-email"
            placeholder="seu@email.com"
            autocomplete="email" />
          <div id="emailError" class="error-msg"></div>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-row">
            <input type="checkbox" id="consentMarketing" />
            <span class="checkbox-label">
              Quero receber novidades de Vinhos de Portugal por email.
            </span>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" id="consentPrivacy" />
            <span class="checkbox-label">
              Li e aceito a <a href="politica_privacidade.html" target="_blank">Política de Privacidade</a>.
            </span>
          </label>
        </div>

        <div class="button-group">
          <button type="submit" id="submitBtn" class="btn btn-primary" disabled>
            Ver Foto
          </button>
          <button type="button" id="skipBtn" class="btn btn-secondary">
            Não quero deixar meu email
          </button>
        </div>
      </form>
    </div>

    <!-- ================================================================
         PHOTO SECTION (visivel apos captura ou skip)
         ================================================================ -->
    <div id="photoSection" class="photo-section">
      <h2 class="photo-title">Saúde!</h2>
      <p class="photo-subtitle">Aqui está sua foto da pisa</p>

      <div class="image-card">
        <img id="dynamicImage" alt="Sua foto do Jogo da Pisa" />
      </div>

      <div class="download-wrapper">
        <a id="downloadButton" class="btn-download">Baixar Foto</a>
      </div>
    </div>

    <p class="footer-text">© Real Games Studio · Vinhos de Portugal 2026</p>
  </div>

  <script>
    // ================================================================
    // CONFIGURACAO
    // ================================================================
    const GAME_ID = 'vinhos_pisa_2026';  // deve bater com EXPECTED_GAME_ID do Apps Script
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTjvD6C5BNJ_jvPB0qqszHTNloeuoQ3zH0ENVzdbkTXe4Yq-bByLeF3HNEyDeEv9Uq/exec';

    // O placeholder e substituido pelo backend que gera o QR code
    const dynamicSrc = '{{media_placeholder}}';

    // ================================================================
    // ELEMENTOS
    // ================================================================
    const formCard = document.getElementById('formCard');
    const photoSection = document.getElementById('photoSection');
    const leadForm = document.getElementById('leadForm');
    const emailInput = document.getElementById('emailInput');
    const consentMarketing = document.getElementById('consentMarketing');
    const consentPrivacy = document.getElementById('consentPrivacy');
    const submitBtn = document.getElementById('submitBtn');
    const skipBtn = document.getElementById('skipBtn');
    const emailError = document.getElementById('emailError');
    const dynamicImage = document.getElementById('dynamicImage');
    const downloadButton = document.getElementById('downloadButton');

    // ================================================================
    // VALIDACAO E ESTADO DO BOTAO
    // ================================================================
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function isValidEmail(email) {
      return EMAIL_REGEX.test(email.trim());
    }

    function updateSubmitState() {
      const emailOk = isValidEmail(emailInput.value);
      const privacyOk = consentPrivacy.checked;
      submitBtn.disabled = !(emailOk && privacyOk);
    }

    emailInput.addEventListener('input', () => {
      emailError.textContent = '';
      updateSubmitState();
    });
    emailInput.addEventListener('blur', () => {
      const v = emailInput.value.trim();
      if (v && !isValidEmail(v)) {
        emailError.textContent = 'Email inválido. Verifique e tente novamente.';
      }
    });
    consentMarketing.addEventListener('change', updateSubmitState);
    consentPrivacy.addEventListener('change', updateSubmitState);

    // ================================================================
    // FOTO — carrega no img e prepara download
    // ================================================================
    function preparePhoto() {
      dynamicImage.src = dynamicSrc;
      downloadButton.href = dynamicSrc;
      const fileName = (window.location.pathname.split('/').pop() || 'jogo_da_pisa') + '.png';
      downloadButton.setAttribute('download', fileName);
    }

    function showPhoto() {
      preparePhoto();
      formCard.style.display = 'none';
      photoSection.classList.add('visible');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ================================================================
    // ENVIO DE EVENTO (lead OU skip — sempre logamos pra ter contagem total)
    // ================================================================
    async function sendEvent(payload) {
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Apps Script Web App nao retorna CORS, mas aceita o POST
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return true;
      } catch (e) {
        console.error('Falha ao enviar evento', e);
        return false;
      }
    }

    function getPhotoId() {
      // Pega ID da foto da URL (filename) ou query param
      const params = new URLSearchParams(window.location.search);
      if (params.has('id')) return params.get('id');
      const fname = window.location.pathname.split('/').pop() || '';
      return fname.replace(/\.html?$/i, '') || 'unknown';
    }

    // ================================================================
    // SUBMIT — captura email
    // ================================================================
    leadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!isValidEmail(email)) {
        emailError.textContent = 'Email inválido.';
        return;
      }
      if (!consentPrivacy.checked) {
        return; // botao ja esta disabled, mas safety
      }

      submitBtn.classList.add('loading');
      submitBtn.textContent = 'Enviando';

      const payload = {
        event: 'lead',
        game_id: GAME_ID,
        email: email,
        consent_marketing: consentMarketing.checked,
        consent_privacy: consentPrivacy.checked,
        photo_id: getPhotoId(),
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent
      };

      // Marca local pra nao pedir de novo se voltar
      try {
        localStorage.setItem('vp_lead_submitted_' + getPhotoId(), '1');
      } catch (_) {}

      // Dispara fire-and-forget — usuario nao precisa esperar resposta
      sendEvent(payload);

      // Mostra a foto imediatamente
      showPhoto();
    });

    // ================================================================
    // SKIP — pula sem deixar email (mas loga evento pra contagem total)
    // ================================================================
    skipBtn.addEventListener('click', () => {
      const payload = {
        event: 'skip',
        game_id: GAME_ID,
        email: '',
        consent_marketing: false,
        consent_privacy: false,
        photo_id: getPhotoId(),
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent
      };

      try {
        localStorage.setItem('vp_lead_skipped_' + getPhotoId(), '1');
      } catch (_) {}

      sendEvent(payload);
      showPhoto();
    });

    // ================================================================
    // INICIALIZACAO — se ja preencheu antes, vai direto pra foto
    // ================================================================
    (function init() {
      const id = getPhotoId();
      const submitted = (() => {
        try { return localStorage.getItem('vp_lead_submitted_' + id); }
        catch (_) { return null; }
      })();
      const skipped = (() => {
        try { return localStorage.getItem('vp_lead_skipped_' + id); }
        catch (_) { return null; }
      })();

      if (submitted || skipped) {
        showPhoto();
      }
    })();
  </script>
</body>
</html>
